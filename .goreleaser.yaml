version: 2
# 릴리스 업로드 대상(remote)이 아직 없다 — 바이너리만 dist/에 만든다: goreleaser release --snapshot --clean
builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/jinto/gslack/internal/cli.Version={{.Version}}"]
archives:
  - formats: [tar.gz]
release:
  disable: true
